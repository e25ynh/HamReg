<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amateur Radio Member Registry · ทะเบียนสมาชิกนักวิทยุสมัครเล่น</title>
<meta name="description" content="ทะเบียนสมาชิกนักวิทยุสมัครเล่น เก็บข้อมูลในเบราว์เซอร์ ส่งออกและนำเข้า CSV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a transceiver front panel. Instrument-style tiles with indicator lamps, a band-usage strip, UTC clock, and a dense member log that folds into cards on phones. */
:root{
  --bg:#e9eff5;
  --surface:#ffffff;
  --surface2:#f3f7fb;
  --ink:#0d1925;
  --muted:#54677a;
  --line:#d2dce6;
  --accent:#066b88;
  --accent-ink:#ffffff;
  --accent-soft:#d9f0f7;
  --chip:#e6f3f8;
  --ok:#137a47; --ok-soft:#daf2e5;
  --warn:#766000; --warn-soft:#f7efbe;
  --orange:#b45309; --orange-soft:#fde8cf;
  --crit:#b0242b; --crit-soft:#fadcdd;
  --dot:rgba(13,25,37,.075);
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080e14; --surface:#0f1923; --surface2:#142130; --ink:#e6edf3; --muted:#8a9db0; --line:#213040;
    --accent:#34d3f0; --accent-ink:#04222b; --accent-soft:#0e2d39; --chip:#0e2632;
    --ok:#55d493; --ok-soft:#0f2f1f;
    --warn:#f2c24f; --warn-soft:#382e0c;
  --orange:#ff9f55; --orange-soft:#3d2210;
    --crit:#ff8d92; --crit-soft:#3a191c;
    --dot:rgba(150,185,215,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080e14; --surface:#0f1923; --surface2:#142130; --ink:#e6edf3; --muted:#8a9db0; --line:#213040;
  --accent:#34d3f0; --accent-ink:#04222b; --accent-soft:#0e2d39; --chip:#0e2632;
  --ok:#55d493; --ok-soft:#0f2f1f;
  --warn:#f2c24f; --warn-soft:#382e0c;
  --orange:#ff9f55; --orange-soft:#3d2210;
  --crit:#ff8d92; --crit-soft:#3a191c;
  --dot:rgba(150,185,215,.10);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font:400 15px/1.55 var(--font);min-height:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 56px;display:flex;flex-direction:column;gap:16px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 45%,transparent))}
h1{margin:0;font:700 25px/1.2 var(--display);letter-spacing:.01em;text-wrap:balance}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clock{display:flex;align-items:baseline;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.clock .k{font:600 11px var(--display);letter-spacing:.14em;color:var(--muted)}
.clock .t{font:600 17px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:500;line-height:1.3;min-height:38px;transition:border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:var(--accent);background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 8px 20px -10px var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.small{padding:3px 11px;font-size:13px;min-height:30px;border-radius:8px}
.btn.icon{padding:0;width:38px;display:grid;place-items:center}
.btn.icon svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.banner:empty{display:none}

/* instrument tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile::before{content:"";position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent)}
.tile.warn::before{background:var(--warn);box-shadow:0 0 9px var(--warn)}
.tile .n{font:700 34px/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tile .l{color:var(--muted);font-size:13px;margin-top:6px;padding-right:12px}

/* expiry alert levels */
.alerts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px 14px}
.alerts:empty{display:none}
.ah{font:600 12px var(--display);letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.ag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.al{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.al:hover{border-color:currentColor}
.al i{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:none}
.al b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.al span{font-size:13px;color:var(--muted)}
.al.zero{opacity:.6}
.al.on{background:var(--surface);border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor;opacity:1}
.al-d90{color:var(--warn)}
.al-d60{color:var(--orange)}
.al-d30{color:var(--crit)}
.al-expired{color:var(--crit)}
.al-expired i{border-radius:2px}

.toolbar{display:grid;grid-template-columns:minmax(200px,2fr) repeat(4,minmax(120px,1fr));gap:8px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px}
.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:72px}
.count{color:var(--muted);font-size:13px}

/* member log */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cols,.row{display:grid;grid-template-columns:132px 128px minmax(160px,1.5fr) 172px 172px minmax(130px,1fr) 118px;gap:12px;align-items:center;padding:11px 14px}
.cols{background:var(--surface2);color:var(--muted);font:600 12px var(--display);letter-spacing:.06em;border-bottom:1px solid var(--line)}
ul.rows{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row.sev-warn{border-left-color:var(--warn)}
.row.sev-crit{border-left-color:var(--crit)}
.row.sev-warn2{border-left-color:var(--orange)}
.row.sev-expired{border-left-color:var(--crit)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.no{color:var(--muted);font-size:13px}
.call{justify-self:start;font:600 15px var(--mono);letter-spacing:.04em;color:var(--accent);background:var(--chip);border:1px solid var(--line);padding:2px 9px;border-radius:7px}
.call.none{color:var(--muted);font-weight:500;background:transparent;border-color:transparent;padding-left:0;letter-spacing:0}
.nm{font-weight:600}
.nick{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok::before,.pill.warn::before,.pill.warn2::before,.pill.crit::before,.pill.expired::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn2{background:var(--orange-soft);color:var(--orange)}
.pill.expired{background:var(--crit);color:var(--surface)}
.pill.off{background:var(--surface2);color:var(--muted)}
.small-t{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 18px var(--display);margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty .actions{justify-content:center;margin-top:14px}

/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(4,9,14,.62);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;z-index:20}
.overlay[hidden]{display:none}
.dlg{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;width:100%;max-width:760px;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.dlg.narrow{max-width:460px}
.dlg h2{margin:0;font:700 19px var(--display);padding:16px 18px 0;letter-spacing:.01em}
.dlg .body{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.dlg .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.field.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{font-weight:400;display:flex;gap:6px;align-items:center;font-size:14px}
.checks input{width:auto;min-height:0;accent-color:var(--accent)}
.err{color:var(--crit);font-size:13px;min-height:1em}
fieldset{border:0;margin:0;padding:0}
.csvbox{width:100%;min-height:200px;font:12px/1.4 var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw}
.toast[hidden]{display:none}

/* member card (real ID-1 size 85.60 x 53.98 mm), hover preview, detail page, print */
.card{
  --c-ink:#eaf2f8; --c-mute:#8fb0c4; --c-acc:#34d3f0; --c-dim:rgba(143,176,196,.30);
  position:relative;width:85.6mm;height:53.98mm;flex:none;border-radius:3.18mm;overflow:hidden;
  color:var(--c-ink);font-family:var(--font);
  background:radial-gradient(120% 95% at 100% 0%,rgba(52,211,240,.22),transparent 58%),linear-gradient(145deg,#0a1621,#0f2535);
  border:1px solid rgba(143,176,196,.38);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.65);
  padding:11px 14px 10px;display:flex;flex-direction:column;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.card .ch{display:flex;align-items:center;gap:8px;height:24px}
.card .cmark{width:22px;height:22px;flex:none}
.card .ct{display:flex;flex-direction:column;min-width:0;line-height:1.15;flex:1}
.card .ct b{font:600 10px var(--display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct span{font-size:9px;color:var(--c-mute);white-space:nowrap}
.card .cn{font:500 10px var(--mono);color:var(--c-mute);white-space:nowrap}
.card .cc{margin-top:8px;font:600 32px/1.05 var(--mono);letter-spacing:.05em;color:var(--c-acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px rgba(52,211,240,.35)}
.card .cc.none{font:500 14px/1.6 var(--font);letter-spacing:0;color:var(--c-mute);text-shadow:none;margin-top:10px}
.card .cname{margin-top:3px;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .csub{font-size:10.5px;color:var(--c-mute);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cl{margin-top:auto;display:flex;align-items:flex-end;gap:14px}
.card .cl span{display:block;font-size:8.5px;color:var(--c-mute);line-height:1.2}
.card .cl b{display:block;font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap}
.card .cl b.bad{color:#ff8d92}
.card .cs{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--c-ink)}
.card .cs i{width:7px;height:7px;border-radius:50%;background:#8fb0c4}
.card .cs.st-active i{background:#55d493;box-shadow:0 0 7px #55d493}
.card .cs.st-pending i{background:#f2c24f;box-shadow:0 0 7px #f2c24f}
.card .cb{margin-top:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.card .cb span{font:500 8.5px/1 var(--mono);text-align:center;padding-top:3px;border-top:3px solid var(--c-dim);color:var(--c-mute)}
.card .cb span.on{border-top-color:var(--c-acc);color:var(--c-acc)}
.pop{position:fixed;left:0;top:0;z-index:30;pointer-events:none}
.pop[hidden]{display:none}
.cardwrap{display:flex;justify-content:center;padding:4px 0 0;overflow-x:auto}
.cardnote{text-align:center;margin-top:-6px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0}
.info>div{min-width:0}
.info dt{font-size:12px;font-weight:600;color:var(--muted)}
.info dd{margin:1px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.info .full{grid-column:1/-1}
#printArea{display:none}
.pnote{font-size:12px;color:#444;margin:6mm 0 0}
@media print{
  body.printing{background:#fff!important;background-image:none!important}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing .card{box-shadow:none}
  @page{margin:14mm}
}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn.renew{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.renew:hover{background:var(--accent-soft)}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ag{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .search{grid-column:1/-1}
  .cols{display:none}
  .row{grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px}
  .row>*{min-width:0}
  .row .c-no{order:2;grid-column:2;text-align:right;white-space:nowrap}
  .row .c-call{order:1}
  .row .c-name{order:3;grid-column:1/-1}
  .row .c-lic{order:4;grid-column:1/-1}
  .row .c-type{order:5;grid-column:1/-1}
  .row .c-contact{order:6;grid-column:1/-1}
  .row .rowact{order:7;grid-column:1/-1;justify-content:flex-start}
  .stack.inline{flex-direction:row;flex-wrap:wrap;align-items:center}
}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  h1{font-size:21px}
  .mark{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.c-no{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><g fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"><path d="M12 28a11 11 0 0 1 0-16"/><path d="M28 12a11 11 0 0 1 0 16"/><path d="M16.5 24a5 5 0 0 1 0-8"/><path d="M23.5 16a5 5 0 0 1 0 8"/></g><circle cx="20" cy="20" r="2.4" fill="var(--accent-ink)"/></svg>
      <div>
        <h1>Amateur Radio Member Registry</h1>
        <p class="sub">ทะเบียนสมาชิกนักวิทยุสมัครเล่น</p>
      </div>
    </div>
    <div class="right">
      <div class="clock" title="เวลา UTC ที่นักวิทยุใช้ลงบันทึก"><span class="k">UTC</span><span class="t" id="utc">--:--</span></div>
      <button class="btn icon" id="btnTheme" type="button" aria-label="สลับโหมดมืดและสว่าง" title="สลับโหมดมืด/สว่าง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
      <button class="btn primary" id="btnAdd" type="button">+ เพิ่มสมาชิก</button>
      <button class="btn" id="btnImport" type="button">นำเข้า CSV</button>
      <button class="btn" id="btnExport" type="button">ส่งออก CSV</button>
      <input type="file" id="fileIn" accept=".csv,text/csv" hidden>
    </div>
  </header>

  <div id="banner" class="banner" role="status"></div>
  <section class="stats" id="stats" aria-label="สรุปจำนวนสมาชิก"></section>
  <section class="alerts" id="alerts" aria-label="แจ้งเตือนวันหมดอายุ"></section>

  <section class="toolbar" aria-label="ค้นหาและกรอง">
    <div class="search"><input id="q" type="search" placeholder="ค้นหาด้วยสัญญาณเรียกขาน ชื่อ เลขสมาชิก LINE" aria-label="ค้นหาสมาชิก"></div>
    <select id="fStatus" aria-label="กรองตามสถานะ"></select>
    <select id="fClass" aria-label="กรองตามชั้นใบอนุญาต"></select>
    <select id="fType" aria-label="กรองตามประเภทสมาชิก"></select>
    <select id="sort" aria-label="เรียงลำดับ">
      <option value="expiry">ใกล้หมดอายุก่อน</option>
      <option value="updated">แก้ไขล่าสุดก่อน</option>
      <option value="memberNo">เลขสมาชิก</option>
      <option value="callsign">สัญญาณเรียกขาน</option>
      <option value="nameTh">ชื่อ-สกุล</option>
    </select>
  </section>

  <div class="count" id="count" aria-live="polite"></div>
  <section class="list" aria-label="รายชื่อสมาชิก">
    <div class="cols" aria-hidden="true">
      <div>เลขที่</div><div>สัญญาณเรียกขาน</div><div>ชื่อ-สกุล</div><div>ใบอนุญาต</div><div>ประเภท / สถานะ</div><div>ติดต่อ</div><div></div>
    </div>
    <ul class="rows" id="rows"></ul>
    <div id="empty" class="empty" hidden></div>
  </section>
</div>

<div class="overlay" id="ov" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="pop" id="pop" hidden aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var CLASSES={none:'ยังไม่มีใบอนุญาต',novice:'ชั้นต้น',inter:'ชั้นกลาง',adv:'ชั้นสูง'};
var TYPES={regular:'สมาชิกสามัญ',student:'นักเรียน/นักศึกษา',assoc:'สมาชิกสมทบ',honor:'กิตติมศักดิ์'};
var STATUS={active:'ใช้งาน',pending:'รอยืนยัน',inactive:'พ้นสภาพ'};
var MODES=['SSB','CW','FM','AM','FT8/FT4','Digital อื่น ๆ','DMR/D-STAR','APRS','ดาวเทียม'];
var BANDS=['HF','6 m','VHF 144','UHF 430','SHF ขึ้นไป'];
var FIELDS=[
  ['memberNo','เลขสมาชิก'],['callsign','สัญญาณเรียกขาน'],['nameTh','ชื่อ-สกุล'],['nameEn','ชื่อภาษาอังกฤษ'],['nickname','ชื่อเล่น'],
  ['memberType','ประเภทสมาชิก'],['status','สถานะ'],['licenseClass','ชั้นใบอนุญาต'],['licenseExpiry','ใบอนุญาตหมดอายุ'],
  ['joinDate','วันที่เข้าเป็นสมาชิก'],['cardDate','วันที่ออกบัตร'],['lineId','LINE ID'],['email','อีเมล'],
  ['qth','ที่ตั้งสถานี (QTH)'],['locator','Grid locator'],['modes','โหมดที่ใช้'],['bands','ย่านความถี่'],
  ['equipment','อุปกรณ์'],['notes','หมายเหตุ']
];
var MAX_IMPORT=500;

/* ---------- state ---------- */
var state={members:[],loading:true,slow:false,err:'',local:false,canWrite:true,q:'',fStatus:'',fClass:'',fType:'',fExp:'',sort:'expiry'};
var busy=false;

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function str(v,max){return String(v==null?'':v).trim().slice(0,max||300)}
function isoOk(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00'))}
function fmtDate(s){
  if(!isoOk(s))return '';
  return new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
}
function daysTo(s){
  if(!isoOk(s))return null;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(s+'T00:00:00')-t)/864e5);
}
function todayIso(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toast(msg){
  var t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3200);
}
function errText(e){
  var c=e&&e.code;
  if(c==='invalid_argument')return 'บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูล ให้เจ้าของหน้านี้เป็นผู้บันทึก';
  if(c==='quota_exceeded')return 'ฐานข้อมูลเต็ม ลบรายการที่ไม่ใช้แล้วจึงบันทึกต่อได้';
  if(c==='resource_exhausted')return 'ส่งคำสั่งถี่เกินไป รอสักครู่แล้วลองอีกครั้ง';
  return 'บันทึกไม่สำเร็จ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง';
}
function enumFrom(map,text,dflt){
  var t=String(text||'').trim();
  for(var k in map){if(k===t||map[k]===t)return k}
  return dflt;
}
function nextMemberNo(){
  var max=0;
  state.members.forEach(function(m){var n=parseInt(String(m.memberNo||'').replace(/\D/g,''),10);if(n>max)max=n});
  return String(max+1).padStart(3,'0');
}
/* เลขสมาชิก: รหัสชั้น + วันที่ออกบัตร DD + '-' + MM + YY(ค.ศ. 2 หลัก) + ตัวอักษรหน้าชื่อภาษาอังกฤษ
   เช่น ชั้นต้น 19 ธ.ค. 2024 ชื่อ Thonphak ได้ B19-1224T ถ้าซ้ำเพิ่มตัวอักษรที่ 2, 3, ... เช่น B19-1224Th */
var NO_CODE={novice:'B',inter:'I',adv:'A',none:'N'};
function enFirst(nameEn){
  var w=String(nameEn||'').trim().split(/\s+/)[0]||'';
  return w.replace(/[^A-Za-z]/g,'');
}
function cap(w){return w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():''}
function genMemberNo(cls,dateIso,skipId,usedMap,nameEn){
  var c=NO_CODE[cls]||'N', d=isoOk(dateIso)?dateIso:todayIso();
  var base=c+d.slice(8,10)+'-'+d.slice(5,7)+d.slice(2,4);
  var taken={};
  state.members.forEach(function(m){if(m.id!==skipId&&m.memberNo)taken[m.memberNo]=1});
  if(usedMap)Object.keys(usedMap).forEach(function(k){taken[k]=1});
  var w=enFirst(nameEn),k,cand;
  for(k=1;k<=w.length;k++){cand=base+cap(w.slice(0,k));if(!taken[cand])return cand}
  var root=w?base+cap(w):base,n=2;
  if(!w&&!taken[root])return root;
  cand=root+'-'+n;
  while(taken[cand]){n++;cand=root+'-'+n}
  return cand;
}
function cmp(a,b){return String(a||'').localeCompare(String(b||''),'th',{numeric:true})}

/* ---------- storage layer (this browser's localStorage) ---------- */
var KEY='hamreg.members.v1', BKKEY='hamreg.lastBackup.v1';
var memOnly=false;
function loadAll(){
  try{
    var raw=localStorage.getItem(KEY);
    var arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr.filter(function(x){return x&&typeof x==='object'&&x.id}):[];
  }catch(e){return state.members||[]}
}
function saveAll(){
  try{localStorage.setItem(KEY,JSON.stringify(state.members));memOnly=false;return true}
  catch(e){memOnly=true;return false}
}
function newId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function persist(id,data){
  var rec=Object.assign({id:id||newId()},data);
  var i=state.members.findIndex(function(m){return m.id===rec.id});
  if(i>=0)state.members[i]=rec;else state.members.push(rec);
  saveAll();renderAll();
  return Promise.resolve(rec.id);
}
function remove(id){
  state.members=state.members.filter(function(m){return m.id!==id});
  saveAll();renderAll();
  return Promise.resolve();
}

/* ---------- rendering ---------- */
function opts(map,first){
  return '<option value="">'+esc(first)+'</option>'+Object.keys(map).map(function(k){return '<option value="'+k+'">'+esc(map[k])+'</option>'}).join('');
}
/* ระดับแจ้งเตือน: หมดแล้ว, ภายใน 30, 31-60, 61-90 วัน */
function expiryInfo(m){
  var d=daysTo(m.licenseExpiry);
  if(d===null)return null;
  if(d<0)return {cls:'expired',lvl:4,text:'หมดอายุแล้ว',d:d};
  if(d<=30)return {cls:'crit',lvl:3,text:'เหลือ '+d+' วัน',d:d};
  if(d<=60)return {cls:'warn2',lvl:2,text:'เหลือ '+d+' วัน',d:d};
  if(d<=90)return {cls:'warn',lvl:1,text:'เหลือ '+d+' วัน',d:d};
  return {cls:'ok',lvl:0,text:'ถึง '+fmtDate(m.licenseExpiry),d:d};
}
function expKey(e){return !e?'':({4:'expired',3:'d30',2:'d60',1:'d90'}[e.lvl]||'')}
function filtered(){
  var q=state.q.toLowerCase();
  var list=state.members.filter(function(m){
    if(state.fStatus&&m.status!==state.fStatus)return false;
    if(state.fClass&&m.licenseClass!==state.fClass)return false;
    if(state.fType&&m.memberType!==state.fType)return false;
    if(state.fExp){if(m.status==='inactive'||expKey(expiryInfo(m))!==state.fExp)return false}
    if(q){
      var hay=[m.callsign,m.nameTh,m.nickname,m.memberNo,m.lineId,m.email,m.qth].join(' ').toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
  var s=state.sort;
  list.sort(function(a,b){
    if(s==='updated')return (b.updatedAt||0)-(a.updatedAt||0);
    if(s==='expiry'){
      /* หมดแล้ว/ใกล้หมดขึ้นก่อน, ไม่ระบุวันหมดอายุต่อท้าย, พ้นสภาพอยู่ท้ายสุด */
      var ia=a.status==='inactive'?1:0, ib=b.status==='inactive'?1:0;
      if(ia!==ib)return ia-ib;
      var x=a.licenseExpiry||'9999-99-99',y=b.licenseExpiry||'9999-99-99';
      if(x!==y)return x<y?-1:1;
      return cmp(a.callsign||a.nameTh,b.callsign||b.nameTh);
    }
    return cmp(a[s],b[s]);
  });
  return list;
}
function renderStats(){
  var ms=state.members, active=0, expiring=0, students=0;
  ms.forEach(function(m){
    if(m.status==='active')active++;
    if(m.memberType==='student'&&m.status!=='inactive')students++;
    if(m.status!=='inactive'){var e=expiryInfo(m);if(e&&e.cls!=='ok')expiring++;}
  });
  $('stats').innerHTML=
    tile(ms.length,'สมาชิกทั้งหมด')+tile(active,'ใช้งานอยู่')+
    tile(expiring,'ใบอนุญาตหมดอายุหรือใกล้หมด (90 วัน)',expiring>0)+tile(students,'นักเรียน/นักศึกษา');
  var AL=[['expired','หมดอายุแล้ว'],['d30','ภายใน 30 วัน'],['d60','31-60 วัน'],['d90','61-90 วัน']];
  var cnt={expired:0,d30:0,d60:0,d90:0};
  ms.forEach(function(m){if(m.status==='inactive')return;var k=expKey(expiryInfo(m));if(k)cnt[k]++});
  $('alerts').innerHTML=ms.length?'<div class="ah">แจ้งเตือนวันหมดอายุ (ไม่รวมพ้นสภาพ) · กดเพื่อกรองรายการ</div><div class="ag">'+AL.map(function(a){
    return '<button type="button" class="al al-'+a[0]+(state.fExp===a[0]?' on':'')+(cnt[a[0]]?'':' zero')+'" data-exp="'+a[0]+'" aria-pressed="'+(state.fExp===a[0])+'"><i></i><b>'+cnt[a[0]]+'</b><span>'+a[1]+'</span></button>';
  }).join('')+'</div>':'';
}
function tile(n,l,warn){return '<div class="tile'+(warn?' warn':'')+'"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>'}

function lastBackup(){try{return +localStorage.getItem(BKKEY)||0}catch(e){return 0}}
function renderBanner(){
  var b=$('banner'),h='',cls='banner';
  if(memOnly){
    h='เบราว์เซอร์นี้ไม่ยอมเก็บข้อมูลถาวร (อาจเปิดในโหมดส่วนตัว) ข้อมูลจะหายเมื่อปิดหน้า กด "ส่งออก CSV" เพื่อเก็บไว้';cls+=' crit';
  }else if(!state.members.length){
    h='ข้อมูลทั้งหมดเก็บในเบราว์เซอร์ของเครื่องนี้ ไม่ถูกส่งขึ้นอินเทอร์เน็ตหรือขึ้น GitHub';
  }else{
    var lb=lastBackup();
    if(!lb){h='ข้อมูลอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น และยังไม่เคยสำรอง กด "ส่งออก CSV" เก็บไว้';cls+=' warn'}
    else{
      var d=Math.floor((Date.now()-lb)/864e5);
      if(d>=30){h='สำรองข้อมูลล่าสุดเมื่อ '+d+' วันก่อน ควรส่งออก CSV ใหม่';cls+=' warn'}
    }
  }
  b.className=cls;b.innerHTML=h;
}
function renderList(){
  hidePop();
  var list=filtered(), ul=$('rows'), em=$('empty');
  $('count').textContent=state.loading?'กำลังโหลดข้อมูล…':('แสดง '+list.length+' จาก '+state.members.length+' รายการ'+(state.fExp?' (กรองตามวันหมดอายุ กดปุ่มเดิมอีกครั้งเพื่อยกเลิก)':''));
  if(!list.length){
    ul.innerHTML='';em.hidden=false;
    if(state.loading){em.innerHTML='<strong>กำลังโหลดรายชื่อ</strong>รอสักครู่';}
    else if(state.members.length){em.innerHTML='<strong>ไม่พบสมาชิกที่ตรงกับเงื่อนไข</strong>ลองล้างคำค้นหาหรือตัวกรอง';}
    else{
      em.innerHTML='<strong>ยังไม่มีสมาชิกในทะเบียน</strong>เพิ่มทีละคน หรือนำเข้าไฟล์ CSV ที่ส่งออกจากทะเบียนเดิม'+
        (state.canWrite?'<div class="actions"><button class="btn primary" type="button" data-act="add">+ เพิ่มสมาชิกคนแรก</button><button class="btn" type="button" data-act="import">นำเข้า CSV</button></div>':'');
    }
    return;
  }
  em.hidden=true;
  ul.innerHTML=list.map(function(m){
    var e=expiryInfo(m);
    var lic='<div class="stack inline"><span class="pill'+(m.licenseClass==='none'?' off':'')+'">'+esc(CLASSES[m.licenseClass]||'—')+'</span>'+
      (e?'<span class="pill '+e.cls+'">'+esc(e.text)+'</span>':'')+
      ((state.canWrite&&e&&e.cls!=='ok')?'<button class="btn small renew" type="button" data-act="renew">ต่ออายุ</button>':'')+'</div>';
    var tp='<div class="stack inline"><span class="pill off">'+esc(TYPES[m.memberType]||'—')+'</span><span class="pill '+(m.status==='active'?'ok':m.status==='pending'?'warn':'off')+'">'+esc(STATUS[m.status]||'—')+'</span></div>';
    var ct=[m.lineId?('LINE: '+m.lineId):'',m.email].filter(Boolean).map(function(x){return '<div class="small-t">'+esc(x)+'</div>'}).join('')||'<div class="small-t">—</div>';
    var sev=(e&&e.cls!=='ok'&&m.status!=='inactive')?' sev-'+e.cls:'';
    return '<li class="row'+sev+'" data-id="'+esc(m.id)+'">'+
      '<div class="c-no no mono">'+esc(m.memberNo||'—')+'</div>'+
      '<div class="c-call call'+(m.callsign?'':' none')+'">'+esc(m.callsign||'ไม่มี')+'</div>'+
      '<div class="c-name"><div class="nm">'+esc(m.nameTh||'(ไม่ระบุชื่อ)')+'</div>'+(m.nickname?'<div class="nick">'+esc(m.nickname)+'</div>':'')+'</div>'+
      '<div class="c-lic">'+lic+'</div><div class="c-type">'+tp+'</div><div class="c-contact">'+ct+'</div>'+
      '<div class="rowact"><button class="btn small" type="button" data-act="edit">'+(state.canWrite?'แก้ไข':'ดู')+'</button>'+
      (state.canWrite?'<button class="btn small" type="button" data-act="del" aria-label="ลบ '+esc(m.nameTh||m.callsign||'')+'">ลบ</button>':'')+'</div></li>';
  }).join('');
}
function renderAll(){renderBanner();renderStats();renderList();syncButtons()}
function syncButtons(){
  $('btnAdd').disabled=!state.canWrite;
  $('btnImport').disabled=!state.canWrite;
  $('btnExport').disabled=!state.members.length;
}

/* ---------- dialog plumbing ---------- */
function openDlg(html,narrow){
  hidePop();
  var d=$('dlg');d.className='dlg'+(narrow?' narrow':'');d.innerHTML=html;
  $('ov').hidden=false;
  var f=d.querySelector('input:not([type=checkbox]),textarea,button');
  if(f)setTimeout(function(){f.focus()},0);
}
function closeDlg(){
  $('ov').hidden=true;$('dlg').innerHTML='';busy=false;
}

/* ---------- member form ---------- */
function selHtml(id,map,val){
  return '<select id="'+id+'">'+Object.keys(map).map(function(k){return '<option value="'+k+'"'+(k===val?' selected':'')+'>'+esc(map[k])+'</option>'}).join('')+'</select>';
}
function checks(name,list,sel){
  return '<div class="checks">'+list.map(function(x,i){
    return '<label><input type="checkbox" name="'+name+'" value="'+esc(x)+'"'+(sel.indexOf(x)>=0?' checked':'')+'> '+esc(x)+'</label>';
  }).join('')+'</div>';
}
function txt(id,label,val,extra){
  extra=extra||{};
  return '<div class="field'+(extra.full?' full':'')+'"><label for="'+id+'">'+esc(label)+'</label>'+
    '<input id="'+id+'" type="'+(extra.type||'text')+'" value="'+esc(val||'')+'"'+(extra.ph?' placeholder="'+esc(extra.ph)+'"':'')+(extra.mono?' class="mono"':'')+(extra.max?' maxlength="'+extra.max+'"':'')+'>'+
    (extra.hint?'<span class="hint">'+esc(extra.hint)+'</span>':'')+'</div>';
}
function openForm(id,prefill){
  var m=id?state.members.find(function(x){return x.id===id}):null;
  var isNew=!m;
  m=m||{memberType:'regular',status:'active',licenseClass:'none',joinDate:todayIso(),cardDate:todayIso(),modes:[],bands:[]};
  if(isNew&&prefill)m=Object.assign(m,prefill);
  if(isNew)m.memberNo=genMemberNo(m.licenseClass,m.cardDate,null,null,m.nameEn);
  var ro=!state.canWrite;
  openDlg(
    '<h2 id="dlgTitle">'+(isNew?'เพิ่มสมาชิกใหม่':ro?'ข้อมูลสมาชิก':'แก้ไขข้อมูลสมาชิก')+'</h2>'+
    '<form id="mform" novalidate><fieldset'+(ro?' disabled':'')+'><div class="body">'+
    '<div class="grid2">'+
      txt('f_memberNo','เลขสมาชิก',m.memberNo,{mono:1,max:20,hint:isNew?'สร้างให้อัตโนมัติ: ชั้น + วันที่ออกบัตร + ตัวหน้าชื่ออังกฤษ เช่น B19-1224T ถ้าซ้ำเพิ่มตัวอักษร เป็น B19-1224Th แก้เองได้':''})+
      txt('f_callsign','สัญญาณเรียกขาน',m.callsign,{mono:1,max:14,ph:'เช่น HS1ABC หรือ E25XYZ',hint:'เว้นว่างได้ถ้ายังไม่มีใบอนุญาต'})+
      txt('f_nameTh','ชื่อ-สกุล *',m.nameTh,{max:120,full:0})+
      txt('f_nameEn','ชื่อภาษาอังกฤษ',m.nameEn,{max:60,ph:'เช่น Thonphak Sathien',hint:'ใช้ตัวอักษรหน้าชื่อต่อท้ายเลขสมาชิก'})+
      txt('f_nickname','ชื่อเล่น',m.nickname,{max:40})+
      '<div class="field"><label for="f_memberType">ประเภทสมาชิก</label>'+selHtml('f_memberType',TYPES,m.memberType)+'</div>'+
      '<div class="field"><label for="f_status">สถานะ</label>'+selHtml('f_status',STATUS,m.status)+'</div>'+
      '<div class="field"><label for="f_licenseClass">ชั้นใบอนุญาต</label>'+selHtml('f_licenseClass',CLASSES,m.licenseClass)+'</div>'+
      txt('f_licenseExpiry','ใบอนุญาตหมดอายุ',m.licenseExpiry,{type:'date'})+
      txt('f_joinDate','วันที่เข้าเป็นสมาชิก',m.joinDate,{type:'date'})+
      txt('f_cardDate','วันที่ออกบัตร',m.cardDate||m.joinDate,{type:'date'})+
      txt('f_lineId','LINE ID',m.lineId,{max:40})+
      txt('f_email','อีเมล',m.email,{max:100,type:'email'})+
      txt('f_qth','ที่ตั้งสถานี (QTH)',m.qth,{max:120,ph:'เช่น พัทยา ชลบุรี'})+
      txt('f_locator','Grid locator',m.locator,{mono:1,max:8,ph:'เช่น OK03'})+
    '</div>'+
    '<div class="field"><span class="lab">โหมดที่ใช้</span>'+checks('modes',MODES,m.modes||[])+'</div>'+
    '<div class="field"><span class="lab">ย่านความถี่</span>'+checks('bands',BANDS,m.bands||[])+'</div>'+
    '<div class="field"><label for="f_equipment">อุปกรณ์</label><textarea id="f_equipment" maxlength="600">'+esc(m.equipment||'')+'</textarea></div>'+
    '<div class="field"><label for="f_notes">หมายเหตุ</label><textarea id="f_notes" maxlength="1200">'+esc(m.notes||'')+'</textarea>'+
      '<span class="hint">ไม่ต้องบันทึกเลขบัตรประชาชนหรือข้อมูลบัญชีธนาคารในทะเบียนนี้</span></div>'+
    '<div class="err" id="ferr" role="alert"></div>'+
    '</div></fieldset>'+
    '<div class="foot"><button class="btn" type="button" data-act="close">'+(ro?'ปิด':'ยกเลิก')+'</button>'+

/* ---------- CSV ---------- */
function csvCell(v){
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function buildCsv(){
  var head=FIELDS.map(function(f){return csvCell(f[1])}).join(',');
  var lines=state.members.slice().sort(function(a,b){return cmp(a.memberNo,b.memberNo)}).map(function(m){
    return FIELDS.map(function(f){
      var k=f[0],v=m[k];
      if(k==='memberType')v=TYPES[v]||v;
      else if(k==='status')v=STATUS[v]||v;
      else if(k==='licenseClass')v=CLASSES[v]||v;
      else if(k==='modes'||k==='bands')v=(v||[]).join(';');
      return csvCell(v);
    }).join(',');
  });
  return '﻿'+[head].concat(lines).join('\r\n')+'\r\n';
}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=c;
    }else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';
      if(row.some(function(x){return x!==''}))rows.push(row);
      row=[];
    }else cur+=c;
  }
  row.push(cur);
  if(row.some(function(x){return x!==''}))rows.push(row);
  return rows;
}
function doExport(){
  if(!state.members.length)return;
  var csv=buildCsv(), name='members-'+todayIso()+'.csv';
  function fallback(){
    openDlg('<h2 id="dlgTitle">ส่งออก CSV</h2><div class="body"><div class="small-t">ดาวน์โหลดไฟล์โดยตรงไม่ได้ คัดลอกข้อความด้านล่างไปวางในไฟล์ .csv (บันทึกเป็น UTF-8)</div><textarea class="csvbox" id="csvbox" readonly></textarea></div><div class="foot"><button class="btn" type="button" data-act="close">ปิด</button><button class="btn primary" type="button" id="csvcopy">คัดลอก</button></div>');
    $('csvbox').value=csv;
    $('csvcopy').addEventListener('click',function(){
      var b=$('csvbox');b.focus();b.select();
      var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(csv):Promise.reject();
      p.then(function(){toast('คัดลอกแล้ว')},function(){toast('กด Ctrl+C เพื่อคัดลอก')});
    });
  }
  try{
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
    try{localStorage.setItem(BKKEY,String(Date.now()))}catch(e){}

  }catch(e){fallback()}
}
function doImport(file){
  var r=new FileReader();
  r.onload=function(){
    var rows=parseCsv(String(r.result||''));
    if(rows.length<2){toast('ไฟล์ไม่มีข้อมูล หรือไม่มีแถวหัวตาราง');return}
    var head=rows[0].map(function(h){return h.trim()});
    var idx={};
    FIELDS.forEach(function(f){
      var i=head.indexOf(f[1]);if(i<0)i=head.indexOf(f[0]);
      if(i>=0)idx[f[0]]=i;
    });
    if(idx.nameTh==null){toast('ไม่พบคอลัมน์ "ชื่อ-สกุล" ในแถวหัวตาราง');return}
    var body=rows.slice(1), over=body.length>MAX_IMPORT;
    if(over)body=body.slice(0,MAX_IMPORT);
    var seenCalls={};
    state.members.forEach(function(m){if(m.callsign)seenCalls[m.callsign]=1});
    var good=[],dup=0,bad=0;
    body.forEach(function(r){
      function g(k,max){return idx[k]==null?'':str((r[idx[k]]||'').replace(/^'(?=[=+\-@])/,''),max)}
      var d={
        memberNo:g('memberNo',20),callsign:g('callsign',14).toUpperCase().replace(/\s+/g,''),nameTh:g('nameTh',120),nameEn:g('nameEn',60),nickname:g('nickname',40),
        memberType:enumFrom(TYPES,g('memberType'),'regular'),status:enumFrom(STATUS,g('status'),'active'),licenseClass:enumFrom(CLASSES,g('licenseClass'),'none'),
        licenseExpiry:g('licenseExpiry'),joinDate:g('joinDate'),cardDate:g('cardDate'),lineId:g('lineId',40),email:g('email',100),
        qth:g('qth',120),locator:g('locator',8).toUpperCase(),
        modes:g('modes').split(/[;；]/).map(function(x){return x.trim()}).filter(Boolean).slice(0,12),
        bands:g('bands').split(/[;；]/).map(function(x){return x.trim()}).filter(Boolean).slice(0,12),
        equipment:g('equipment',600),notes:g('notes',1200)
      };
      if(!d.nameTh){bad++;return}
      if(d.licenseExpiry&&!isoOk(d.licenseExpiry))d.licenseExpiry='';
      if(d.joinDate&&!isoOk(d.joinDate))d.joinDate='';
      if(d.cardDate&&!isoOk(d.cardDate))d.cardDate='';
      if(d.callsign){if(seenCalls[d.callsign]){dup++;return}seenCalls[d.callsign]=1}
      good.push(d);
    });
    if(!good.length){toast('ไม่มีแถวที่นำเข้าได้ (ซ้ำ '+dup+' ไม่มีชื่อ '+bad+')');return}
    openDlg('<h2 id="dlgTitle">นำเข้าจาก CSV</h2><div class="body"><div>พบ <strong>'+good.length+'</strong> รายการที่นำเข้าได้</div>'+
      ((dup||bad||over)?'<div class="small-t">ข้าม '+dup+' รายการที่สัญญาณเรียกขานซ้ำ และ '+bad+' รายการที่ไม่มีชื่อ'+(over?' ระบบนำเข้าครั้งละไม่เกิน '+MAX_IMPORT+' แถว':'')+'</div>':'')+
      '<div class="small-t">รายการเดิมในทะเบียนจะไม่ถูกแก้ไข เลขสมาชิกที่ว่างจะถูกเติมให้ต่อจากเลขล่าสุด</div>'+
      '<div class="err" id="ferr" role="alert"></div><div class="small-t" id="prog"></div></div>'+
      '<div class="foot"><button class="btn" type="button" data-act="close">ยกเลิก</button><button class="btn primary" type="button" id="goImp">นำเข้า '+good.length+' รายการ</button></div>',true);
    $('goImp').addEventListener('click',function(){
      if(busy)return;busy=true;this.disabled=true;
      var n=0,used={},now=Date.now();
      (function step(){
        if(n>=good.length){closeDlg();toast('นำเข้า '+n+' รายการแล้ว');return}
        var d=good[n];
        if(!d.memberNo){d.memberNo=genMemberNo(d.licenseClass,d.cardDate||d.joinDate,null,used,d.nameEn)}
        used[d.memberNo]=1;
        d.createdAt=now;d.updatedAt=now+n;
        persist(null,d).then(function(){
          n++;var p=$('prog');if(p)p.textContent='กำลังนำเข้า '+n+' / '+good.length;
          setTimeout(step,0);
        },function(e){
          busy=false;var b=$('goImp');if(b)b.disabled=false;
          var er=$('ferr');if(er)er.textContent='นำเข้าได้ '+n+' รายการแล้วหยุด: '+errText(e);
        });
      })();
    });
  };
  r.readAsText(file,'utf-8');
}

  openDlg('<h2 id="dlgTitle">ต่ออายุบัตร / อัปเดตสถานะ</h2><div class="body">'+
    '<div><strong>'+esc(m.nameTh||'(ไม่ระบุชื่อ)')+'</strong>'+(m.callsign?' ('+esc(m.callsign)+')':'')+'<br>'+
      '<span class="small-t">วันหมดอายุเดิม: '+(cur?esc(fmtDate(cur)):'ไม่ระบุ')+(e?' · '+esc(e.cls==='expired'?'หมดอายุแล้ว':'เหลือ '+e.d+' วัน'):'')+' · สถานะ: '+esc(STATUS[m.status]||'—')+'</span></div>'+
    '<div class="field"><label for="r_date">วันหมดอายุใหม่ (แสดงบนบัตร)</label><input id="r_date" type="date">'+
      '<div class="quick">'+RENEW_YEARS.map(function(n){return '<button class="btn small" type="button" data-y="'+n+'">+'+n+' ปี</button>'}).join('')+'</div>'+
      '<span class="hint">นับจากวันหมดอายุเดิมถ้ายังไม่หมด หรือนับจากวันนี้ถ้าหมดแล้ว แก้วันที่เองได้</span></div>'+
    '<div class="field"><label for="r_card">วันที่ออกบัตรใหม่</label><input id="r_card" type="date">'+
      '<span class="hint" id="r_no"></span></div>'+
    '<div class="field"><label for="r_note">หมายเหตุการต่ออายุ (ไม่บังคับ)</label><input id="r_note" type="text" maxlength="120" placeholder="เช่น ชำระค่าบำรุงแล้ว"></div>'+
    '<div class="small-t">เมื่อกดต่ออายุ สถานะจะเป็น "ใช้งาน" ระบบออกเลขสมาชิกใหม่ตามวันที่ออกบัตรใหม่ และบันทึกประวัติการต่ออายุ (รวมเลขเดิม) ไว้ในหน้าข้อมูลสมาชิก</div>'+
    '<div class="err" id="ferr" role="alert"></div></div>'+
    '<div class="foot"><button class="btn" type="button" data-act="close">ยกเลิก</button>'+
    (m.status==='inactive'?'':'<button class="btn" type="button" id="rLapse">ไม่ต่ออายุ ตั้งเป็นพ้นสภาพ</button>')+
    '<button class="btn primary" type="button" id="rSave">ต่ออายุ</button></div>',true);
  $('r_date').value=addYears(base,RENEW_YEARS[0]);
  $('r_card').value=today;
  function showNo(){
    var cd=$('r_card').value, nn=isoOk(cd)?genMemberNo(m.licenseClass,cd,m.id,null,m.nameEn):'';
    $('r_no').textContent=nn?('เลขสมาชิกใหม่: '+nn+(m.memberNo&&m.memberNo!==nn?' (เลขเดิม '+m.memberNo+')':' (เหมือนเดิม)')):'กรอกวันที่ออกบัตรให้ถูกต้อง';
  }
  showNo();
  $('r_card').addEventListener('change',showNo);
  Array.prototype.forEach.call(document.querySelectorAll('#dlg [data-y]'),function(b){
    b.addEventListener('click',function(){$('r_date').value=addYears(base,+b.getAttribute('data-y'))});
  });
  function finish(p,msg){
    busy=true;
    p.then(function(){closeDlg();toast(msg)},function(er){busy=false;$('ferr').textContent=errText(er)});
  }
  $('rSave').addEventListener('click',function(){
    if(busy)return;
    var nd=$('r_date').value,er=$('ferr');
    if(!isoOk(nd)){er.textContent='กรอกวันหมดอายุใหม่ให้ถูกต้อง';return}
    if(nd<=today){er.textContent='วันหมดอายุใหม่ต้องเป็นวันในอนาคต';return}
    if(cur&&nd<=cur){er.textContent='วันหมดอายุใหม่ต้องหลังวันหมดอายุเดิม ('+fmtDate(cur)+')';return}
    var cd=$('r_card').value;
    if(!isoOk(cd)){er.textContent='กรอกวันที่ออกบัตรใหม่ให้ถูกต้อง';return}
    var nn=genMemberNo(m.licenseClass,cd,m.id,null,m.nameEn);
    var entry={type:'renew',date:today,from:cur,to:nd,note:str($('r_note').value,120)};
    if(m.memberNo&&m.memberNo!==nn)entry.oldNo=m.memberNo;
    var hist=(m.renewals||[]).concat([entry]).slice(-20);
    finish(persist(id,Object.assign({},m,{licenseExpiry:nd,cardDate:cd,memberNo:nn,status:'active',updatedAt:Date.now(),renewals:hist})),'ต่ออายุถึง '+fmtDate(nd)+' เลขสมาชิก '+nn);
  });
  var lp=$('rLapse');
  if(lp)lp.addEventListener('click',function(){
    if(busy)return;
    var hist=(m.renewals||[]).concat([{type:'lapse',date:today,from:cur,to:'',note:''}]).slice(-20);
    finish(persist(id,Object.assign({},m,{status:'inactive',updatedAt:Date.now(),renewals:hist})),'ตั้งเป็นพ้นสภาพแล้ว');
  });
}

/* ---------- events ---------- */
function bind(){
  $('fStatus').innerHTML=opts(STATUS,'ทุกสถานะ');
  $('fClass').innerHTML=opts(CLASSES,'ทุกชั้นใบอนุญาต');
  $('fType').innerHTML=opts(TYPES,'ทุกประเภทสมาชิก');
  var t;
  $('q').addEventListener('input',function(){var v=this.value.trim();clearTimeout(t);t=setTimeout(function(){state.q=v;renderList()},120)});
  $('fStatus').addEventListener('change',function(){state.fStatus=this.value;renderList()});
  $('fClass').addEventListener('change',function(){state.fClass=this.value;renderList()});
  $('fType').addEventListener('change',function(){state.fType=this.value;renderList()});
  $('sort').addEventListener('change',function(){state.sort=this.value;renderList()});
  $('btnAdd').addEventListener('click',function(){openForm(null)});
  $('btnImport').addEventListener('click',function(){$('fileIn').click()});
  $('btnExport').addEventListener('click',doExport);
  $('rows').addEventListener('mouseover',onRowOver);
  $('rows').addEventListener('mousemove',onRowMove);
  $('rows').addEventListener('mouseleave',hidePop);
  window.addEventListener('scroll',hidePop,true);
  $('fileIn').addEventListener('change',function(){var f=this.files&&this.files[0];this.value='';if(f)doImport(f)});
  document.addEventListener('click',function(ev){
    var ex=ev.target.closest('[data-exp]');
    if(ex){var k=ex.getAttribute('data-exp');state.fExp=(state.fExp===k)?'':k;renderStats();renderList();return}
    var a=ev.target.closest('[data-act]');
    if(a){
      var act=a.getAttribute('data-act'), row=a.closest('.row'), id=row&&row.getAttribute('data-id');
      if(act==='add')openForm(null);
      else if(act==='import')$('fileIn').click();
      else if(act==='edit'&&id)openForm(id);
      else if(act==='del'&&id)askDelete(id);
      else if(act==='renew'&&id)openRenew(id);
      else if(act==='close')closeDlg();
      return;
    }
    var r=ev.target.closest('.row');
    if(r&&$('rows').contains(r))openDetail(r.getAttribute('data-id'));
  });
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){hidePop();if(!$('ov').hidden&&!busy)closeDlg()}});
  $('ov').addEventListener('mousedown',function(ev){if(ev.target===this&&!busy)closeDlg()});
}

/* ---------- start ---------- */
function applyTheme(t){
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
function isDark(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t)return t==='dark';
  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function tick(){
  var d=new Date();
  $('utc').textContent=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
}
function init(){
  try{applyTheme(localStorage.getItem('hamreg.theme'))}catch(e){}
  $('btnTheme').addEventListener('click',function(){
    var next=isDark()?'light':'dark';applyTheme(next);
    try{localStorage.setItem('hamreg.theme',next)}catch(e){}
  });
  tick();setInterval(tick,20000);
  bind();
  state.members=loadAll();state.loading=false;
  try{localStorage.setItem('hamreg.test','1');localStorage.removeItem('hamreg.test');memOnly=false}catch(e){memOnly=true}
  window.addEventListener('storage',function(e){if(e.key===KEY){state.members=loadAll();renderAll()}});
  renderAll();
}
init();
})();
</script>
</body>
</html>
